<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f3d56" />
  <meta name="description" content="Diário de obra offline para equipes de campo" />
  <link rel="manifest" href="/campo/manifest.webmanifest" />
  <link rel="icon" href="/campo/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/campo/styles.css" />
  <title>Diário de Obra - Campo</title>
</head>
<body>
  <div id="root"><div class="loading">Carregando aplicativo de campo...</div></div>
  <script src="/vendor/react.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react@18.3.1/umd/react.production.min.js'"></script>
  <script src="/vendor/react-dom.production.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'"></script>
  <script src="/vendor/pdf-lib.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js'"></script>
  <script src="/vendor/jszip.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'"></script>
  <script>
    if (window.React && window.ReactDOM && window.PDFLib && window.JSZip) {
      const script = document.createElement("script");
      script.src = "/campo/app.js";
      document.body.appendChild(script);
    } else {
      document.getElementById("root").innerHTML = '<div class="loading"><strong>Bibliotecas do aplicativo não foram carregadas.</strong><br>Execute INSTALAR_E_INICIAR.bat no computador central ou verifique a conexão desta publicação.</div>';
    }
  </script>
</body>
</html>
